<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja strona</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f2f5ff;
      color: #182440;
    }
    main {
      width: min(100%, 650px);
      padding: clamp(28px, 8vw, 72px);
      border: 1px solid #d7dff5;
      border-radius: 24px;
      background: #fff;
    }
    h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; }
    p { margin: 0; color: #4b5874; font-size: 1.125rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Moja strona</h1>
    <p>To moja strona startowa na GitHub Pages.</p>
  </main>
</body>
</html>
